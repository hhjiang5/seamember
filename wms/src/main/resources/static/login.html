<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 船员管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%230b8fa5'/%3E%3Cpath d='m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3 6.3-2.1Z' fill='white'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100vh; overflow: hidden;
    background: linear-gradient(165deg, #0a2440 0%, #071b30 55%, #04121f 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* 航海图网格 */
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 78%);
  }
  /* 顶部柔光 */
  .bg-glow {
    position: absolute; top: -180px; left: 50%; transform: translateX(-50%);
    width: 860px; height: 560px;
    background: radial-gradient(ellipse, rgba(18, 148, 176, .30), transparent 65%);
    pointer-events: none;
  }
  /* 缓慢旋转的罗盘玫瑰 */
  .compass-rose {
    position: absolute; right: -70px; bottom: 90px;
    width: 420px; height: 420px; opacity: .10;
    animation: spin 180s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 波浪 */
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; }
  .waves svg { position: absolute; bottom: -2px; left: 0; width: 200%; height: 100%; }
  .wave-a { animation: drift 26s ease-in-out infinite alternate; }
  .wave-b { animation: drift 34s ease-in-out infinite alternate-reverse; opacity: .55; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* 登录卡片 */
  .card {
    position: relative; z-index: 2;
    width: 400px; max-width: calc(100vw - 32px);
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 40px 38px 30px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
  }
  .card-head { text-align: center; margin-bottom: 30px; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, #12a8b8, #0b6f96);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 26px rgba(10, 140, 165, .5);
  }
  .mark svg { width: 30px; height: 30px; }
  .card h1 { color: #fff; font-size: 21px; font-weight: 800; letter-spacing: 2px; }
  .eyebrow { margin-top: 8px; font-size: 9.5px; letter-spacing: 3.5px; color: #7fc8dc; font-weight: 700; }

  .fld { margin-bottom: 16px; }
  .fld label { display: block; font-size: 12px; font-weight: 700; color: #9fc4de; margin-bottom: 7px; }
  .inp {
    display: flex; align-items: center; gap: 11px;
    height: 46px; padding: 0 15px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 11px;
    transition: border-color .16s, box-shadow .16s, background .16s;
  }
  .inp svg { width: 17px; height: 17px; color: rgba(255,255,255,.55); flex: none; }
  .inp:focus-within {
    border-color: #31c0d8;
    background: rgba(255,255,255,.11);
    box-shadow: 0 0 0 3px rgba(49, 192, 216, .18);
  }
  .inp input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: #fff; font-family: inherit; font-size: 14.5px;
  }
  .inp input::placeholder { color: rgba(255,255,255,.4); }

  .err {
    display: none; align-items: flex-start; gap: 8px;
    background: rgba(210, 68, 68, .16);
    border: 1px solid rgba(240, 128, 128, .4);
    color: #ffb4b4;
    border-radius: 9px; padding: 9px 12px;
    font-size: 12.5px; font-weight: 600; line-height: 1.5;
    margin-bottom: 14px;
  }
  .err svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
  .err.show { display: flex; animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); } 75% { transform: translateX(6px); }
    50% { transform: translateX(4px); }
  }

  .btn-login {
    width: 100%; height: 46px;
    border: none; border-radius: 11px;
    background: linear-gradient(135deg, #12a8b8, #0b8fa5);
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(11, 143, 165, .4);
    transition: transform .15s, filter .15s, box-shadow .15s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-login:hover:not([disabled]) { transform: translateY(-1px); filter: brightness(1.08); }
  .btn-login:active { transform: translateY(1px); }
  .btn-login[disabled] { opacity: .7; cursor: not-allowed; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: rot .7s linear infinite; display: none;
  }
  .btn-login.loading .spinner { display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .card-foot { margin-top: 24px; text-align: center; font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,.32); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <svg class="compass-rose" viewBox="0 0 200 200" fill="none" stroke="#7fd8e8" stroke-width="1">
    <circle cx="100" cy="100" r="96"/>
    <circle cx="100" cy="100" r="70"/>
    <circle cx="100" cy="100" r="12"/>
    <path d="m100 4-9 22 9 18 9-18z" fill="#7fd8e8" stroke="none"/>
    <path d="m100 156-9 22 9 18 9-18z" fill="#7fd8e8" stroke="none"/>
    <path d="m4 100 22-9 18 9-18 9z" fill="#7fd8e8" stroke="none"/>
    <path d="m156 100 22-9 18 9-18 9z" fill="#7fd8e8" stroke="none"/>
    <path d="M100 30v20M100 150v20M30 100h20M150 100h20" />
    <path d="M70 30l30 70 30-70M70 170l30-70 30 70M30 70l70 30-70 30M170 70l-70 30 70 30" opacity=".6"/>
  </svg>

  <div class="waves">
    <svg class="wave-a" viewBox="0 0 2400 150" preserveAspectRatio="none">
      <path d="M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60 T1500 60 T1800 60 T2100 60 T2400 60 V150 H0 Z" fill="rgba(18,140,168,.16)"/>
    </svg>
    <svg class="wave-b" viewBox="0 0 2400 150" preserveAspectRatio="none">
      <path d="M0 85 Q200 45 400 85 T800 85 T1200 85 T1600 85 T2000 85 T2400 85 V150 H0 Z" fill="rgba(9,60,92,.5)"/>
    </svg>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3 6.3-2.1Z"/></svg>
      </div>
      <h1>船员管理系统</h1>
      <div class="eyebrow">SEAFARER MANAGEMENT SYSTEM</div>
    </div>

    <form id="form" autocomplete="off">
      <div class="fld">
        <label>用户名</label>
        <div class="inp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <input type="text" id="username" placeholder="请输入用户名" value="admin">
        </div>
      </div>
      <div class="fld">
        <label>密码</label>
        <div class="inp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="请输入密码" value="123456">
        </div>
      </div>
      <div class="err" id="err">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span id="errMsg"></span>
      </div>
      <button type="submit" class="btn-login" id="btn">
        <span class="spinner"></span><span id="btnText">登 录</span>
      </button>
    </form>

    <div class="card-foot">海员档案 · 证书 · 合同 · 培训 · 派员</div>
  </div>

<script src="js/common.js"></script>
<script>
  // 已登录则直接进入首页
  if (getUser()) location.href = 'index.html';

  const errBox = $('#err'), errMsg = $('#errMsg'), btn = $('#btn'), btnText = $('#btnText');

  function showErr(msg) {
    errMsg.textContent = msg;
    errBox.classList.remove('show');
    void errBox.offsetWidth; // 重新触发抖动动画
    errBox.classList.add('show');
  }

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const username = $('#username').value.trim();
    const password = $('#password').value.trim();
    if (!username || !password) { showErr('请输入用户名和密码'); return; }

    errBox.classList.remove('show');
    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = '登录中…';
    try {
      const data = await post('/api/auth/login', { username, password });
      localStorage.setItem('user', JSON.stringify(data));
      location.href = 'index.html';
    } catch (err) {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = '登 录';
      showErr(err.message);
    }
  });
</script>
</body>
</html>
